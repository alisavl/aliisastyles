<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>@aliisastyles</title>
  <meta name="description" content="Fashion finds and favourite things by @aliisastyles.">
  <style>
    @font-face { font-family: "Neue Montreal"; src: url("Neue Montreal/NeueMontreal-Regular.otf") format("opentype"); font-weight: 400; font-style: normal; font-display: swap; }
    @font-face { font-family: "Neue Montreal"; src: url("Neue Montreal/NeueMontreal-Medium.otf") format("opentype"); font-weight: 500; font-style: normal; font-display: swap; }
    @font-face { font-family: "Neue Montreal"; src: url("Neue Montreal/NeueMontreal-Bold.otf") format("opentype"); font-weight: 700; font-style: normal; font-display: swap; }

    :root {
      --bg: #FAF9F5;
      --card: #ffffff;
      --image-bg: #f0eee8;
      --text: #362000;
      --text-secondary: #704900;
      --name: #e9e6df;
      --border: rgba(54, 32, 0, 0.06);
      --badge-bg: rgba(255, 255, 255, 0.82);
      --shadow: 0 1px 2px rgba(54,32,0,0.04), 0 4px 16px rgba(54,32,0,0.05);
      --shadow-hover: 0 2px 4px rgba(54,32,0,0.05), 0 18px 40px rgba(54,32,0,0.12);
      --avatar-shadow: 0 20px 50px rgba(54,32,0,0.22);
      --focus: #704900;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1308;
        --card: #241b0e;
        --image-bg: #2e2415;
        --text: #FAF9F5;
        --text-secondary: #d9a95c;
        --name: #2c2213;
        --border: rgba(250, 249, 245, 0.06);
        --badge-bg: rgba(36, 27, 14, 0.78);
        --shadow: none;
        --shadow-hover: 0 18px 40px rgba(0,0,0,0.5);
        --avatar-shadow: 0 20px 50px rgba(0,0,0,0.6);
        --focus: #d9a95c;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Neue Montreal", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.4;
    }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 24px 120px;
    }

    a:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    /* ---- Clock ---- */
    .clock {
      text-align: center;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 15px;
      letter-spacing: 0.04em;
      color: var(--text-secondary);
      min-height: 1.4em;
    }

    /* ---- Hero ---- */
    .hero {
      position: relative;
      display: grid;
      place-items: center;
      margin: 48px 0 40px;
    }
    .name {
      font-size: clamp(72px, 22vw, 132px);
      font-weight: 700;
      letter-spacing: -0.05em;
      line-height: 0.86;
      text-align: center;
      color: var(--name);
      user-select: none;
    }
    .name span { display: block; }
    .avatar {
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(96px, 18vw, 128px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow: var(--avatar-shadow);
    }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* ---- Socials ---- */
    .socials {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-width: 560px;
      margin: 0 auto 56px;
    }
    .social {
      display: grid;
      place-items: center;
      height: 64px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      color: var(--text-secondary);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .social:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); }
    .social svg { width: 28px; height: 28px; }

    /* ---- Topic list ---- */
    .section-label {
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      margin: 0 4px 16px;
    }
    .topics {
      display: flex;
      flex-direction: column;
      gap: 20px;
      list-style: none;
    }

    .topic {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 44%;
      min-height: 240px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      overflow: hidden;
      color: inherit;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1), box-shadow 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    a.topic:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
    a.topic:active { transform: scale(0.99); }

    .topic-body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px;
    }
    .topic-icon { width: 26px; height: 26px; color: var(--text-secondary); }
    .topic-title {
      font-size: clamp(22px, 3vw, 26px);
      font-weight: 500;
      letter-spacing: -0.015em;
      line-height: 1.2;
    }
    .topic-meta {
      margin-top: 4px;
      font-size: clamp(17px, 2.2vw, 20px);
      color: var(--text-secondary);
    }

    .topic-media {
      position: relative;
      margin-top: 72px;
      background: var(--image-bg);
      border-top-left-radius: 20px;
      overflow: hidden;
    }
    .topic-media img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center 28%;
      transition: transform 0.6s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    a.topic:hover .topic-media img { transform: scale(1.04); }

    /* Fanned product stack */
    .stack { position: absolute; inset: 0; display: flex; }
    .stack img { position: static; flex: 1; min-width: 0; }

    /* Placeholder art for upcoming topics */
    .topic-media.placeholder {
      display: grid;
      place-items: center;
      color: var(--text-secondary);
    }
    .topic-media.placeholder svg { width: 72px; height: 72px; opacity: 0.35; }

    .arrow {
      position: absolute;
      top: 24px; right: 24px;
      width: 28px; height: 28px;
      color: var(--text-secondary);
      transition: transform 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    a.topic:hover .arrow { transform: translate(3px, -3px); }

    .soon {
      position: absolute;
      top: 24px; right: 24px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--image-bg);
    }

    @media (max-width: 600px) {
      main { padding: 32px 16px 80px; }
      .hero { margin: 36px 0 32px; }
      .socials { margin-bottom: 40px; }
      .topics { gap: 14px; }
      .topic { min-height: 200px; grid-template-columns: 1fr 42%; border-radius: 24px; }
      .topic-body { padding: 22px; }
      .topic-media { margin-top: 64px; }
      .arrow, .soon { top: 20px; right: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
      a.topic:hover, a.topic:hover .topic-media img, a.topic:hover .arrow, .social:hover { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="clock" id="clock" aria-live="off"></p>

    <header class="hero">
      <h1 class="name" aria-hidden="true"><span>@aliisa</span><span>styles</span></h1>
      <span class="visually-hidden">@aliisastyles</span>
      <div class="avatar">
        <img src="images/profile.jpg" alt="Profile photo of @aliisastyles" width="128" height="128">
      </div>
    </header>

    <nav class="socials" aria-label="Social profiles">
      <a class="social" href="https://www.instagram.com/aliisastyles/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.4" cy="6.6" r="0.6" fill="currentColor" stroke="none"/></svg>
      </a>
      <a class="social" href="https://www.tiktok.com/@aliisastyles" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.6 3c.3 2.1 1.6 3.6 3.9 3.8v3a7.3 7.3 0 0 1-3.8-1.2v6.2a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v3.1a2.7 2.7 0 1 0 1.8 2.5V3h2.9z"/></svg>
      </a>
      <a class="social" href="mailto:alisa.vlasov@yahoo.com" aria-label="Email">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg>
      </a>
    </nav>

    <h2 class="section-label">Collections</h2>
    <ul class="topics">
      <li>
        <a class="topic" href="knitwear.html">
          <div class="topic-body">
            <svg class="topic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M9 3.5L4 6v5l2.5 1V20.5h11V12l2.5-1V6l-5-2.5c-.5 1.4-1.6 2.2-3 2.2s-2.5-.8-3-2.2z"/></svg>
            <div>
              <h3 class="topic-title">Natural Knitwear</h3>
              <p class="topic-meta">7 cotton &amp; wool sweaters</p>
            </div>
          </div>
          <div class="topic-media">
            <div class="stack">
              <img src="images/02893309.jpg" alt="" loading="lazy">
              <img src="images/02893322.jpg" alt="" loading="lazy">
              <img src="images/03166340.jpg" alt="" loading="lazy">
            </div>
          </div>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18L18 6M8 6h10v10"/></svg>
        </a>
      </li>

      <li>
        <a class="topic" href="statement.html">
          <div class="topic-body">
            <svg class="topic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>
            <div>
              <h3 class="topic-title">Statement Pieces</h3>
              <p class="topic-meta">6 wishlist items</p>
            </div>
          </div>
          <div class="topic-media">
            <div class="stack">
              <img src="images/sp-pants.jpg" alt="" loading="lazy">
              <img src="images/sp-cardigan.jpg" alt="" loading="lazy">
              <img src="images/sp-boots.jpg" alt="" loading="lazy">
            </div>
          </div>
          <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18L18 6M8 6h10v10"/></svg>
        </a>
      </li>

      <li>
        <div class="topic" aria-disabled="true">
          <div class="topic-body">
            <svg class="topic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6V9z"/><path d="M17 10.5h1.5a2.5 2.5 0 0 1 0 5H16.5"/><path d="M8 3.5c0 1.2 1 1.2 1 2.4M12 3.5c0 1.2 1 1.2 1 2.4"/></svg>
            <div>
              <h3 class="topic-title">Matcha Kit</h3>
              <p class="topic-meta">Everything for my daily matcha</p>
            </div>
          </div>
          <div class="topic-media placeholder">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h13v4a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6V9z"/><path d="M17 10.5h1.5a2.5 2.5 0 0 1 0 5H16.5"/><path d="M8 3.5c0 1.2 1 1.2 1 2.4M12 3.5c0 1.2 1 1.2 1 2.4"/></svg>
          </div>
          <span class="soon">Coming soon</span>
        </div>
      </li>
    </ul>
  </main>

  <script>
    const clock = document.getElementById("clock");
    function tick() {
      const now = new Date();
      const day = now.toLocaleDateString("en-GB", { weekday: "short" });
      const date = now.toLocaleDateString("en-GB", { day: "numeric", month: "short" });
      const time = now.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: true });
      clock.textContent = `${day} ${date}, ${time}`.toUpperCase();
    }
    tick();
    setInterval(tick, 10000);
  </script>
</body>
</html>
